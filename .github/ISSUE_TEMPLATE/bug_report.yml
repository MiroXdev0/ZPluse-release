name: Bug report
description: Report a problem with a Z+ release, the installer, or an included tool
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with Z+.

        For security vulnerabilities, please do **not** use this form — see [SECURITY.md](https://github.com/MiroXdev0/ZPluse-release/blob/main/SECURITY.md) for how to report privately.
  - type: input
    id: zplus-version
    attributes:
      label: Z+ version
      description: The version you were using when the problem occurred.
      placeholder: e.g. 1.3.5
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system and architecture
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Windows Server (x64)
        - Other / older Windows version
    validations:
      required: true
  - type: input
    id: downloaded-file
    attributes:
      label: Downloaded filename
      description: The exact release file involved, if the problem is about a download, the installer, or a checksum mismatch.
      placeholder: e.g. ZPlus-1.3.5-Setup.exe
  - type: textarea
    id: error-or-detection
    attributes:
      label: Error message or antivirus detection name
      description: Paste the exact error message, or the antivirus product and the exact detection name.
      placeholder: e.g. an error from zp / zpm / zpbuild, or "Windows Defender — Trojan:Win32/Wacatac.B!ml"
      render: text
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, logs, checksum results, or anything else that might help.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      description: Issues are public and searchable.
      options:
        - label: I have not included passwords, private tokens, or other sensitive information.
          required: true
